services:
  - type: web
    name: trademind-ml
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn ml_fastapi:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MODEL_DIR
        value: ./output
